# Docker Compose pentru mediul de dezvoltare RentCam
services:
  mysql:
    image: mysql:8.0
    container_name: rentcam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rentcam_db}
      MYSQL_USER: ${MYSQL_USER:-rentcam_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rentcam_pass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_date:/var/lib/mysql
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentcam-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-rentcam_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-rentcam_pass}
      DB_NAME: ${MYSQL_DATABASE:-rentcam_db}
      JWT_SECRET: ${JWT_SECRET:-rentcam_secret_jwt_cheie_sigura_2026}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentcam-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_date:
    name: rentcam_mysql_date
